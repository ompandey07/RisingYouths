{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="{% static 'Images/Logo/logo.png' %}" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <style>
        body {
            background: #ffffff;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .input-group {
            position: relative;
        }
        
        .floating-label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            padding: 0 8px;
            color: #6b7280;
            transition: all 0.3s ease;
            pointer-events: none;
            font-size: 16px;
        }
        
        .form-input:focus + .floating-label,
        .form-input:not(:placeholder-shown) + .floating-label {
            top: 0;
            font-size: 12px;
            color: #4f46e5;
            font-weight: 500;
        }
        
        .form-input {
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #4f46e5, #6366f1);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }
        
        .card-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
        }
        
        .eye-icon {
            transition: all 0.2s ease;
        }
        
        .eye-icon:hover {
            color: #4f46e5;
        }

        /* Toast Styles */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            min-width: 300px;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast-error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        
        .toast-success {
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        
        @keyframes slideOutRight {
            from { transform: translateX(0); }
            to { transform: translateX(100%); }
        }
        
        .toast-slide-in {
            animation: slideInRight 0.3s ease forwards;
        }
        
        .toast-slide-out {
            animation: slideOutRight 0.3s ease forwards;
        }

        /* Preloader Bar Styles */
        .preloader-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.1);
            z-index: 9999;
            overflow: hidden;
        }

        .preloader-progress {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #6366f1, #8b5cf6);
            background-size: 200% 100%;
            animation: loading 2s ease-in-out infinite;
            width: 0%;
            transition: width 0.3s ease;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .preloader-pulse {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Main Content Container */
        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .content-wrapper {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 480px;
        }

        .center-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #4f46e5, #6366f1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem auto;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
            transition: all 0.3s ease;
        }

        .center-logo:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.4);
        }

        /* Mobile Responsiveness */
        @media (max-width: 640px) {
            .content-wrapper {
                padding: 2rem;
                margin: 1rem;
            }
            
            .top-bar {
                padding: 0.75rem 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Preloader Bar -->
    <div class="preloader-bar">
        <div class="preloader-progress" id="preloader-progress">
            <div class="preloader-pulse"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-40 space-y-2"></div>

    <!-- Main Content -->
    <div class="main-container">
        <div class="content-wrapper animate-fade-in-up">
            <!-- Center Logo -->
            <div class="center-logo">
                <img src="{% static 'Images/Logo/logo.png' %}" alt="Logo" class="w-12 h-12 object-contain">
            </div>

            <!-- Welcome Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h1>
                <p class="text-gray-600">Sign in to your account to continue your journey</p>
            </div>

            <!-- Login Form -->
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <!-- Username Field -->
                <div class="input-group">
                    <input 
                        type="email" 
                        name="username" 
                        id="username"
                        class="form-input w-full px-4 py-3 border-2 border-gray-200 rounded-xl bg-gray-50 text-gray-900 placeholder-transparent"
                        placeholder="Username"
                        required
                    >
                    <label for="username" class="floating-label">Email</label>
                </div>

                <!-- Password Field -->
                <div class="input-group">
                    <div class="relative">
                        <input 
                            type="password" 
                            name="password" 
                            id="password"
                            class="form-input w-full px-4 py-3 pr-12 border-2 border-gray-200 rounded-xl bg-gray-50 text-gray-900 placeholder-transparent"
                            placeholder="Password"
                            required
                        >
                        <label for="password" class="floating-label">Password</label>
                        <button 
                            type="button" 
                            onclick="togglePassword()"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 eye-icon"
                        >
                            <svg id="eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                            <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" name="remember_me" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <span class="ml-2 text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="/forgot-password" class="text-sm text-indigo-600 hover:text-indigo-500 transition-colors">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    name="submit"
                    class="btn-primary w-full py-3 px-4 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transform transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/50"
                >
                    Sign In
                </button>

                <!-- Sign Up Link -->
                <div class="text-center pt-4 border-t border-gray-200">
                    <p class="text-gray-600">
                        Go to Home Again? 
                        <a href="{% url "main_home_page_view" %}" class="text-indigo-600 hover:text-indigo-500 font-medium transition-colors">
                            Home
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeOpen = document.getElementById('eye-open');
            const eyeClosed = document.getElementById('eye-closed');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
            }
        }

        // Toast notification system
        function showToast(message, type = 'error') {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'toast-error' : 'toast-success'} p-4 rounded-lg shadow-lg flex items-center justify-between`;
            
            toast.innerHTML = `
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        ${type === 'error' ? 
                            '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>' : 
                            '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>'
                        }
                    </svg>
                    <span>${message}</span>
                </div>
                <button onclick="hideToast(this)" class="ml-4 text-gray-500 hover:text-gray-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            `;
            
            toastContainer.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => {
                toast.classList.add('toast-slide-in');
            }, 10);
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                hideToast(toast);
            }, 5000);
        }

        function hideToast(toastElement) {
            const toast = toastElement.tagName === 'BUTTON' ? toastElement.closest('.toast') : toastElement;
            toast.classList.remove('toast-slide-in');
            toast.classList.add('toast-slide-out');
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 300);
        }

        // Add some interactive feedback
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
            });
        });

        // Form submission with loading state
        document.querySelector('form').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Signing in...
            `;
            submitBtn.disabled = true;
        });

        // Check for Django messages and display as toast
        document.addEventListener('DOMContentLoaded', function() {
            // This would be populated by Django messages framework
            {% if messages %}
                {% for message in messages %}
                    showToast("{{ message }}", "{{ message.tags|default:'error' }}");
                {% endfor %}
            {% endif %}
        });

        // Smooth scroll effect for mobile
        if (window.innerWidth <= 768) {
            document.body.style.overflowX = 'hidden';
        }

        // Preloader functionality
        function simulateLoading() {
            const progressBar = document.getElementById('preloader-progress');
            let progress = 0;
            
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 100) progress = 100;
                
                progressBar.style.width = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.querySelector('.preloader-bar').style.opacity = '0';
                        setTimeout(() => {
                            document.querySelector('.preloader-bar').style.display = 'none';
                        }, 500);
                    }, 500);
                }
            }, 200);
        }

        // Start loading animation on page load
        window.addEventListener('load', () => {
            simulateLoading();
        });

        // Also trigger on form submission
        document.querySelector('form').addEventListener('submit', function(e) {
            document.querySelector('.preloader-bar').style.display = 'block';
            document.querySelector('.preloader-bar').style.opacity = '1';
            document.getElementById('preloader-progress').style.width = '0%';
            simulateLoading();
        });
    </script>
</body>
</html>
